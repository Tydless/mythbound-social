function videoCard(v,i){return '<button class="video" data-video="'+i+'" aria-label="'+esc(v[0])+'"><div class="thumb" style="--tone:'+tones[i]+'"><div class="vp-placeholder"><strong>▶</strong><small>'+labels[i]+'</small></div>'+art('thumb-'+(i+1)+'.png','')+'<span class="duration">'+v[3]+'</span></div><h3>'+esc(v[0])+'</h3><small>'+v[2]+' views · '+v[1]+'</small></button>'}
function channelPage(q=''){setPage('channel');let items=videos.map((v,i)=>({v,i})).filter(({v})=>v[0].toLowerCase().includes(q.trim().toLowerCase()));if(sortMode==='latest')items.reverse();else if(sortMode==='popular')items.sort((a,b)=>b.v[2]-a.v[2]);root.innerHTML=channelHeader()+tabs('videos')+'<div class="vp-heading"><h2>Uploads</h2><small>'+items.length+' of '+videos.length+' videos</small></div><div class="vp-sort" aria-label="Sort videos">'+[['latest','Latest'],['popular','Popular'],['oldest','Oldest']].map(([id,label])=>'<button data-sort="'+id+'" class="'+(sortMode===id?'active':'')+'" aria-pressed="'+(sortMode===id)+'">'+label+'</button>').join('')+'</div><div class="grid vp-grid">'+items.map(({v,i})=>videoCard(v,i)).join('')+'</div>'+(items.length?'':'<p class="empty">No matching videos.</p>')+footer();bindSub();bindTabs();root.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>watch(Number(b.dataset.video)));root.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{sortMode=b.dataset.sort;channelPage(search.value)})}
function watch(i){const v=videos[i];if(!v)return;setPage('watch');root.innerHTML='<div class="watch"><button class="back" id="back">‹ Back to channel</button><div class="player">'+art('frame-'+(i+1)+'.png','Frozen video frame')+'<div class="buffer vp-buffer" id="buffer" role="status"><div class="spin" aria-hidden="true"></div><small>Buffering…</small></div><div class="controls"><button id="play" aria-label="Play video">▶</button><span>0:00 / '+v[3]+'</span></div></div><h1>'+esc(v[0])+'</h1><div class="statline"><b>'+channel+'</b><small>12 subscribers</small><button id="like">♡ Like</button></div><div class="desc"><b>'+v[2]+' views · '+v[1]+'</b><p>'+esc(v[4])+'</p></div><h2>'+v[5].length+' comments</h2>'+v[5].map(c=>'<div class="comment"><span class="bubble">'+esc(c[0][0])+'</span><div><strong>@'+esc(c[0])+'</strong><p>'+esc(c[1])+'</p>'+(c[2]?'<div class="reply"><strong>@'+esc(c[2][0])+' · Creator</strong><p>'+esc(c[2][1])+'</p><span class="heart">'+esc(c[2][2]||'')+'</span></div>':'')+'</div></div>').join('')+'</div>'+footer();document.getElementById('back').onclick=()=>channelPage();document.getElementById('play').onclick=()=>{const holder=document.getElementById('buffer'),player=holder.parentElement,button=document.getElementById('play');if(player.querySelector('video'))return;button.disabled=true;holder.querySelector('small').textContent='Buffering…';const vid=document.createElement('video');vid.controls=true;vid.playsInline=true;vid.preload='metadata';vid.hidden=true;vid.addEventListener('loadeddata',()=>{if(!vid.isConnected)return;holder.hidden=true;vid.hidden=false;vid.play().catch(()=>{})},{once:true});vid.addEventListener('error',()=>{vid.remove();button.disabled=false;holder.hidden=false;holder.querySelector('small').textContent='Buffering…'},{once:true});player.append(vid);vid.src='assets/video-'+(i+1)+'.mp4'};document.getElementById('like').onclick=e=>{e.currentTarget.textContent=e.currentTarget.textContent.includes('♡')?'♥ Liked':'♡ Like'};window.scrollTo(0,0);bufferJoke()}
function messages(){setPage('messages');root.innerHTML='<div class="dm"><button id="back">‹ Channel</button><h2>Private messages</h2><b>'+channel+'</b><p class="muted">THREE WEEKS AGO</p><div class="msg">Wait. You actually play Mythbound?</div><div class="msg me">Yeah! Been playing for a while :D</div><div class="msg">What’s your username?</div><div class="msg me">'+esc(nick)+'</div><div class="msg">I usually prefer playing alone. But I wouldn’t mind playing with you.</div><p class="muted">TODAY</p><div class="msg">I put together a group for us. Don’t invite anybody else.</div><div class="invite"><b>✧ MYTHBOUND ONLINE</b><h2>You have been invited!</h2><p>Private party · 2 / 4 members</p><a href="../mythbound/?invite=yandere">Accept invitation</a></div><div class="msg">It’s just us, by the way. I think that’s better.</div></div>'+footer();document.getElementById('back').onclick=()=>channelPage()}
document.getElementById('home').onclick=()=>{search.value='';channelPage()};document.getElementById('for-you').onclick=()=>{search.value='';category='All';discovery(false,'',true)};document.getElementById('shorts').onclick=()=>{search.value='';discovery(true,'',true)};document.getElementById('messages').onclick=messages;document.getElementById('internet-dismiss').onclick=hideToast;search.oninput=()=>{if(page==='feed'||page==='mock-watch')discovery(false,search.value);else if(page==='shorts'||page==='short-watch')discovery(true,search.value);else channelPage(search.value)};channelPage();

})();</script></body></html>
