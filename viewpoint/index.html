<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viewpoint — Channel</title><link rel="stylesheet" href="../media-platforms.css"><style>:root{--accent:#b94255}</style></head><body><header><span class="brand"><b>▶</b> Viewpoint</span><input class="search" id="search" placeholder="Search channel videos" aria-label="Search channel videos"><button id="messages">✉ Messages</button><button id="home">Channel</button></header><main class="wrap" id="main"></main><script>
const root=document.getElementById('main'),search=document.getElementById('search');
let profile={nickname:'You'};try{profile=JSON.parse(localStorage.getItem('mythbound-local-profile-v1'))||profile}catch{}
const nick=String(profile.nickname||'You'),channel='NobodyUnderstands';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const videos=[
['An introduction. Watch before commenting.','4 months ago',38,'8:42','Please watch the entire video before forming an opinion.',[['MicrowaveEnjoyer','bro has a manifesto with 12 subscribers'],['ActuallyHelpful','Maybe introduce yourself before explaining why everyone is wrong?'],[channel,'I deliberately chose to introduce my principles rather than superficial details about myself.']]],
['Why nobody understands genuine passion anymore','3 months ago',21,'24:18','My thoughts on the decline of sincere interest and dedication.',[['MicrowaveEnjoyer','24 minutes of this is impressive'],['FREE_COINS_NOW','Earn 5000 coins today!!!'],[nick,"I don't agree with everything, but it's nice that you're so passionate. Don't let the comments discourage you.",[channel,"Thank you. Seriously. You're the first person here who actually listened.",'❤ Hearted by creator']]]],
['My collection — a closer look','2 months ago',36,'19:33','A few things I have collected over the years.',[['ActuallyHelpful','This is genuinely pretty cool.'],['MicrowaveEnjoyer','rare normal video'],[channel,'I am capable of making normal videos.']]],
['Responding to the allegations.','7 weeks ago',87,'47:02','I will not tolerate deliberate misrepresentation.',[['MicrowaveEnjoyer','i literally said ok'],[channel,'Context matters. The dismissive tone was obvious and I felt it necessary to clarify my position.']]],
['I quit.','6 weeks ago',9,'14:52','There is nothing left to say.',[['MicrowaveEnjoyer','No one cares, dude.']]],
['Mythbound gameplay — solo grinding','1 month ago',16,'18:23','A quiet evening in Mythbound.',[[nick,'Wait, you play Mythbound too? :D',[channel,"YOU PLAY??? I'll message you privately.",'❤ Hearted by creator']],['MicrowaveEnjoyer','didnt you quit']]],
['Why I Prefer Playing Alone','5 days ago',26,'22:44','Depending on other people inevitably leads to disappointment. I have always been more comfortable in my own company.',[['ActuallyHelpful','Some people just like playing together.'],[channel,'That is their prerogative.']]],
['Grinding with '+nick+' ♡','3 days ago',31,'42:16','An exception. A very special exception.',[['MicrowaveEnjoyer','LOL he folded immediately',[channel,'My previous statement was a general observation. Making an exception does not invalidate my argument.']],['MicrowaveEnjoyer','bro is in love',[channel,"You don't know anything about my personal life."]],['MicrowaveEnjoyer','you literally upload it'],['RandomViewer','wait you have friends?',[channel,'Friend. Singular.']]]]
];
function art(file,alt){return '<img src="assets/'+file+'" alt="'+esc(alt)+'" onerror="this.remove()">'}
function footer(){return '<p class="notice">Viewpoint is a fictional video platform for a character story. All content and interactions are simulated.</p>'}
function top(){return '<div class="banner"><span>CHANNEL BANNER</span>'+art('banner.png','Channel banner')+'</div><div class="identity"><div class="profile">◉'+art('profile.png','Channel profile')+'</div><div><h1>'+channel+'</h1><p class="muted">@'+channel+' · 12 subscribers · '+videos.length+' videos</p><p>The truth doesn’t care about your feelings.</p><button class="accent" id="sub">Subscribe</button></div></div>'}
let subscribed=false;try{subscribed=localStorage.getItem('viewpoint-subscribed')==='1'}catch{}
function bindSub(){const b=document.getElementById('sub');if(!b)return;b.textContent=subscribed?'Subscribed':'Subscribe';b.onclick=()=>{subscribed=!subscribed;try{localStorage.setItem('viewpoint-subscribed',subscribed?'1':'0')}catch{}bindSub()}}
function channelPage(q=''){root.innerHTML=top()+'<div class="tabs"><button class="active" id="videos">Videos</button><button id="about">About</button></div><div class="grid">'+videos.map((v,i)=>({v,i})).reverse().filter(({v})=>v[0].toLowerCase().includes(q.toLowerCase())).map(({v,i})=>'<button class="video" data-video="'+i+'"><div class="thumb"><strong>▶</strong>'+art('thumb-'+(i+1)+'.png','')+'<span class="duration">'+v[3]+'</span></div><h3>'+esc(v[0])+'</h3><small>'+v[2]+' views · '+v[1]+'</small></button>').join('')+'</div>'+footer();bindSub();root.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>watch(Number(b.dataset.video)));document.getElementById('videos').onclick=()=>channelPage();document.getElementById('about').onclick=()=>{root.innerHTML=top()+'<div class="aboutcard"><h2>About</h2><p>This channel exists to discuss my interests without compromising my principles. Comments are not an invitation to psychoanalyze me.</p><p class="muted">Joined 4 months ago · 12 subscribers</p></div>'+footer();bindSub()}}
function watch(i){const v=videos[i];if(!v)return;root.innerHTML='<div class="watch"><button class="back" id="back">‹ Back to channel</button><div class="player">'+art('frame-'+(i+1)+'.png','Frozen video frame')+'<div class="buffer" id="buffer"><div class="spin"></div><small>Buffering…</small></div><div class="controls"><button id="play">Ⅱ</button><span>0:00 / '+v[3]+'</span></div></div><h1>'+esc(v[0])+'</h1><div class="statline"><b>'+channel+'</b><small>12 subscribers</small><button id="like">♡ Like</button></div><div class="desc"><b>'+v[2]+' views · '+v[1]+'</b><p>'+esc(v[4])+'</p></div><h2>'+v[5].length+' comments</h2>'+v[5].map(c=>'<div class="comment"><span class="bubble">'+esc(c[0][0])+'</span><div><strong>@'+esc(c[0])+'</strong><p>'+esc(c[1])+'</p>'+(c[2]?'<div class="reply"><strong>@'+esc(c[2][0])+' · Creator</strong><p>'+esc(c[2][1])+'</p><span class="heart">'+esc(c[2][2]||'')+'</span></div>':'')+'</div></div>').join('')+'</div>'+footer();document.getElementById('back').onclick=()=>channelPage();let playing=true;document.getElementById('play').onclick=e=>{playing=!playing;e.currentTarget.textContent=playing?'Ⅱ':'▶';document.getElementById('buffer').hidden=!playing};document.getElementById('like').onclick=e=>{e.currentTarget.textContent=e.currentTarget.textContent.includes('♡')?'♥ Liked':'♡ Like'};window.scrollTo(0,0)}
function messages(){root.innerHTML='<div class="dm"><button id="back">‹ Channel</button><h2>Private messages</h2><b>'+channel+'</b><p class="muted">THREE WEEKS AGO</p><div class="msg">Wait. You actually play Mythbound?</div><div class="msg me">Yeah! Been playing for a while :D</div><div class="msg">What’s your username?</div><div class="msg me">'+esc(nick)+'</div><div class="msg">I usually prefer playing alone. But I wouldn’t mind playing with you.</div><p class="muted">TODAY</p><div class="msg">I put together a group for us. Don’t invite anybody else.</div><div class="invite"><b>✧ MYTHBOUND ONLINE</b><h2>You have been invited!</h2><p>Private party · 2 / 4 members</p><a href="../mythbound/?invite=yandere">Accept invitation</a></div><div class="msg">It’s just us, by the way. I think that’s better.</div></div>'+footer();document.getElementById('back').onclick=()=>channelPage()}
document.getElementById('home').onclick=()=>channelPage();document.getElementById('messages').onclick=messages;search.oninput=()=>channelPage(search.value);channelPage();
</script></body></html>
