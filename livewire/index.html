<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Livewire — Rookie's channel</title><link rel="stylesheet" href="../media-platforms.css"><style>:root{--accent:#8055cf}.banner{background:linear-gradient(120deg,#3d2862,#65548a,#2f2347)}.stream-info{margin-bottom:25px}.stream-layout video{z-index:3}</style></head><body><header><span class="brand"><b>▣</b> Livewire</span><span class="search">Browse / Mythbound</span><button id="home">Channel</button><a class="tag" href="../mythbound/">Mythbound</a></header><main id="main" class="wrap"></main><script>
const root=document.getElementById('main');
let profile={nickname:'You'};try{profile=JSON.parse(localStorage.getItem('mythbound-local-profile-v1'))||profile}catch{}
const nick=String(profile.nickname||'You');
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const name='RookieOnQuest',clips=[
['FINALLY REACHED LEVEL 20!!!','3 days ago','1:27:35','12 views'],
['My first dungeon! (it went badly)','1 week ago','2:03:11','8 views'],
['Learning what all these buttons do','2 weeks ago','1:16:09','5 views'],
['My first Mythbound stream :D','3 weeks ago','49:21','4 views']
];
let followed=false;try{followed=localStorage.getItem('livewire-follow')==='1'}catch{}
let replayTimer=null;
function art(file,alt){return '<img src="assets/'+file+'" alt="'+escapeText(alt)+'" onerror="this.remove()">'}
function footer(){return '<p class="notice">Livewire is a fictional streaming platform. Streams, viewers and chat are simulated. Your chat messages stay in this page.</p>'}
function channelHeader(){return '<div class="banner"><span>ROOKIE ON QUEST!</span>'+art('banner.png','Stream channel banner')+'</div><div class="identity"><div class="profile">R'+art('profile.png','Rookie profile')+'</div><div><h1>'+name+'</h1><p class="muted"><span id="follows">'+(followed?4:3)+'</span> followers · Mythbound</p><p>Hi!! I’m new here and trying my best :D</p><button id="follow" class="accent">'+(followed?'♥ Following':'♡ Follow')+'</button></div></div>'}
function bindFollow(){const b=document.getElementById('follow');if(!b)return;b.onclick=()=>{followed=!followed;try{localStorage.setItem('livewire-follow',followed?'1':'0')}catch{}b.textContent=followed?'♥ Following':'♡ Follow';document.getElementById('follows').textContent=followed?'4':'3'}}
function cards(){return '<div class="grid">'+clips.map((v,i)=>'<button class="video" data-clip="'+i+'"><div class="thumb"><strong>▶</strong>'+art('thumb-'+(i+1)+'.png','')+'<span class="duration">'+v[2]+'</span></div><h3>'+escapeText(v[0])+'</h3><small>'+v[3]+' · '+v[1]+'</small></button>').join('')+'</div>'}
const lines=[['00:05','PixelToast','hiii'],['00:12',name,'HELLO!! can you hear me??'],['00:20','WoollyWanderer','yes lol'],['00:28',name,'oh thank goodness'],['00:45','PixelToast','what level are you now?'],['00:52',name,'20!!! finally!!!'],['01:02',name,'my friend '+nick+' helped me a lot :D'],['01:18','WoollyWanderer','grats!!!'],['01:32',name,'WAIT I THINK I PULLED SOMETHING'],['01:36','PixelToast','RUN'],['01:44',name,'...'],['01:51','WoollyWanderer','F'],['02:03',name,'we do not talk about that']];
function appendLine(who,msg,time){const log=document.getElementById('chatlog');if(!log)return;const p=document.createElement('p'),t=document.createElement('small'),b=document.createElement('b');t.textContent=time+' ';b.textContent=who+': ';p.append(t,b,document.createTextNode(msg));log.append(p);log.scrollTop=log.scrollHeight}
function stopReplay(){if(replayTimer!==null){clearInterval(replayTimer);replayTimer=null}}
function stream(title,index=-1){stopReplay();root.innerHTML=channelHeader()+'<div class="tabs"><button id="stream" class="active">Stream</button><button id="videos">Videos</button><button id="about">About</button></div><div class="stream-layout"><section><div class="player" id="player"><div class="stream-overlay"><span class="live" style="background:#514366">STREAM REPLAY</span></div>'+art(index<0?'stream-still.png':'thumb-'+(index+1)+'.png','Stream still')+'<div class="placeholder" id="intro-placeholder"><strong>Rookie’s stream</strong><span>Recorded broadcast · Mythbound</span><button id="intro" class="accent">▶ Play introduction</button></div></div><div class="stream-meta"><div><h2>'+escapeText(title)+'</h2><p class="muted">Mythbound · 3 viewers at time of recording</p><span class="tag">Beginner friendly</span><span class="tag">Chill gaming</span><span class="tag">English</span></div><button id="replay">Restart chat replay</button></div></section><aside class="chat"><h3>STREAM CHAT · REPLAY</h3><div class="chatlog" id="chatlog"></div><form id="chat-form"><input id="chat-input" maxlength="250" placeholder="Send a local chat message" aria-label="Chat message"><button class="accent">Chat</button></form></aside></div><h2>Recent broadcasts</h2>'+cards()+footer();bindFollow();bindTabs();bindCards();startReplay();document.getElementById('replay').onclick=startReplay;document.getElementById('chat-form').onsubmit=e=>{e.preventDefault();const input=document.getElementById('chat-input');if(input.value.trim()){appendLine(nick,input.value.trim(),'Now');input.value=''}};document.getElementById('intro').onclick=playIntro}
function startReplay(){stopReplay();const log=document.getElementById('chatlog');if(!log)return;log.replaceChildren();let i=0;function next(){if(i>=lines.length){stopReplay();return}const t=lines[i++];appendLine(t[1],t[2],t[0])}next();next();replayTimer=setInterval(next,2300)}
function playIntro(){const holder=document.getElementById('intro-placeholder');const vid=document.createElement('video');vid.className='intro';vid.controls=true;vid.playsInline=true;vid.preload='metadata';vid.src='assets/introduction.mp4';vid.addEventListener('error',()=>{vid.remove();holder.hidden=false;holder.innerHTML='<strong>Introduction coming soon!</strong><span>The animated clip is not uploaded yet.</span>'},{once:true});vid.addEventListener('loadeddata',()=>{holder.hidden=true;vid.play().catch(()=>{})},{once:true});document.getElementById('player').append(vid)}
function bindCards(){root.querySelectorAll('[data-clip]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.clip);stream(clips[i][0],i);window.scrollTo(0,0)})}
function bindTabs(){document.getElementById('stream').onclick=()=>stream('Learning Mythbound with friends ♡');document.getElementById('videos').onclick=()=>{stopReplay();root.innerHTML=channelHeader()+'<div class="tabs"><button id="stream">Stream</button><button id="videos" class="active">Videos</button><button id="about">About</button></div>'+cards()+footer();bindFollow();bindTabs();bindCards()};document.getElementById('about').onclick=()=>{stopReplay();root.innerHTML=channelHeader()+'<div class="tabs"><button id="stream">Stream</button><button id="videos">Videos</button><button id="about" class="active">About</button></div><div class="aboutcard"><h2>About me!</h2><p>I started streaming because I love Mythbound, even though I’m terrible at it sometimes. My friend '+escapeText(nick)+' helps me with all the difficult stuff. Thanks for being here!!</p><p><a class="tag" href="../mythbound/">Play Mythbound with me ↗</a></p><p class="muted">No set schedule yet. I stream whenever I can!</p></div>'+footer();bindFollow();bindTabs()}}
document.getElementById('home').onclick=()=>stream('Learning Mythbound with friends ♡');stream('Learning Mythbound with friends ♡');
</script></body></html>
