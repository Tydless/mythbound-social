<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Livewire — Rookie's channel</title><link rel="stylesheet" href="../media-platforms.css"><style>:root{--accent:#8055cf}.banner{background:linear-gradient(120deg,#3d2862,#65548a,#2f2347)}.stream-info{margin-bottom:25px}.stream-layout video{z-index:3}.following-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 18px}.following-head h2{margin:0}.following-head p{margin:4px 0;color:#a4a4b0}.following-search{background:#18181d;border:1px solid #40404a;color:#f1f1f4;border-radius:7px;padding:9px 12px;max-width:100%;width:250px}.following-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}.following-card{background:#202028;border:1px solid #35353f;border-radius:10px;padding:16px;display:flex;gap:13px;align-items:center;text-align:left;min-width:0}.following-card:hover{background:#292934;border-color:#8055cf}.following-avatar{width:57px;height:57px;border-radius:50%;background:linear-gradient(140deg,#65548a,#35313f);display:grid;place-items:center;overflow:hidden;flex:none;font-size:22px;font-weight:800;position:relative}.following-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.following-card strong,.following-card small{display:block;overflow-wrap:anywhere}.following-card .offline{font-size:11px;color:#a8a8b3;display:flex;align-items:center;gap:5px;margin-top:5px}.offline:before{content:"";width:7px;height:7px;border-radius:50%;background:#8d8d9b}.following-count{color:#bda7fa}.guest-channel .profile{position:relative}.guest-channel .profile img{position:absolute;inset:0}.following-back{margin-bottom:12px}.following-card[hidden]{display:none!important}@media(max-width:500px){.following-head{align-items:stretch}.following-search{width:100%}.following-grid{grid-template-columns:1fr}}</style></head><body><header><span class="brand"><b>▣</b> Livewire</span><span class="search">Browse / Mythbound</span><button id="home">Channel</button><a class="tag" href="../mythbound/">Mythbound</a></header><main id="main" class="wrap"></main><script>
const root=document.getElementById('main');
let profile={nickname:'You'};try{profile=JSON.parse(localStorage.getItem('mythbound-local-profile-v1'))||profile}catch{}
const nick=String(profile.nickname||'You');
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const name='RookieOnQuest',clips=[
['FINALLY REACHED LEVEL 20!!!','3 days ago','1:27:35','12 views'],
['My first dungeon! (it went badly)','1 week ago','2:03:11','8 views'],
['Learning what all these buttons do','2 weeks ago','1:16:09','5 views'],
['My first Mythbound stream :D','3 weeks ago','49:21','4 views']
];
let followed=false;try{followed=localStorage.getItem('livewire-follow')==='1'}catch{}
let replayTimer=null;
// Rookie's own subscriptions, independent of the player's Follow button.
// The two sample entries are provisional fictional channels. Add approved guest details here.
const followingChannels=[
 {id:'pixeltoast',name:'PixelToast',category:'Variety gaming',bio:'A little gaming, a little chaos.',status:'Offline',avatar:'',banner:''},
 {id:'woollywanderer',name:'WoollyWanderer',category:'Mythbound',bio:'Exploring the world one quest at a time.',status:'Offline',avatar:'',banner:''},
 {id:'yellowalinee',name:'YellowAlinee',category:'Mythbound',bio:'',status:'Offline',avatar:'',banner:''}
];
function art(file,alt){return '<img src="assets/'+file+'" alt="'+escapeText(alt)+'" onerror="this.remove()">'}
function footer(){return '<p class="notice">Livewire is a fictional streaming platform. Streams, viewers and chat are simulated. Your chat messages stay in this page.</p>'}
function channelHeader(){return '<div class="banner"><span>ROOKIE ON QUEST!</span>'+art('banner.png','Stream channel banner')+'</div><div class="identity"><div class="profile">R'+art('profile.png','Rookie profile')+'</div><div><h1>'+name+'</h1><p class="muted"><span id="follows">'+(followed?4:3)+'</span> followers · Mythbound</p><p>Hi!! I’m new here and trying my best :D</p><button id="follow" class="accent">'+(followed?'♥ Following':'♡ Follow')+'</button></div></div>'}
function channelTabs(active){return '<div class="tabs">'+[['stream','Stream'],['videos','Videos'],['about','About'],['following','Following']].map(([id,label])=>'<button id="'+id+'"'+(id===active?' class="active" aria-current="page"':'')+'>'+label+(id==='following'?' <span class="following-count">'+followingChannels.length+'</span>':'')+'</button>').join('')+'</div>'}
function followingAvatar(c,cls='following-avatar'){return '<div class="'+cls+'">'+escapeText(c.name.slice(0,1).toUpperCase())+(c.avatar?art(c.avatar,c.name+' profile'):'')+'</div>'}
function followingCard(c){return '<button class="following-card" data-following-channel="'+escapeText(c.id)+'">'+followingAvatar(c)+'<div><strong>'+escapeText(c.name)+'</strong><small>'+escapeText(c.category)+'</small><span class="offline">'+escapeText(c.status)+'</span></div></button>'}
function followingPage(){
 stopReplay();root.innerHTML=channelHeader()+channelTabs('following')+'<div class="following-head"><div><h2>Following <span class="following-count">'+followingChannels.length+'</span></h2><p>Channels RookieOnQuest follows.</p></div><input id="following-search" class="following-search" type="search" placeholder="Find a channel" aria-label="Search followed channels"></div><div class="following-grid">'+followingChannels.map(followingCard).join('')+'</div><p id="following-empty" class="empty" hidden>No matching channels.</p>'+footer();
 bindFollow();bindTabs();
 root.querySelectorAll('[data-following-channel]').forEach(b=>b.onclick=()=>guestChannel(b.dataset.followingChannel));
 const input=document.getElementById('following-search');input.oninput=()=>{const q=input.value.trim().toLowerCase();let count=0;root.querySelectorAll('[data-following-channel]').forEach(b=>{const c=followingChannels.find(x=>x.id===b.dataset.followingChannel);b.hidden=!(c.name+' '+c.category).toLowerCase().includes(q);if(!b.hidden)count++});document.getElementById('following-empty').hidden=count!==0};
}
function guestChannel(id){const c=followingChannels.find(x=>x.id===id);if(!c)return;stopReplay();root.innerHTML='<button id="back-following" class="following-back">← Rookie’s Following</button><div class="guest-channel"><div class="banner"><span>'+escapeText(c.name.toUpperCase())+'</span>'+(c.banner?art(c.banner,c.name+' channel banner'):'')+'</div><div class="identity">'+followingAvatar(c,'profile')+'<div><h1>'+escapeText(c.name)+'</h1><p class="muted">'+escapeText(c.category)+' · '+escapeText(c.status)+'</p><p>'+escapeText(c.bio)+'</p><span class="tag">♥ Followed by RookieOnQuest</span></div></div><div class="aboutcard"><h2>Offline</h2><p>No broadcasts available here yet.</p></div></div>'+footer();document.getElementById('back-following').onclick=followingPage;window.scrollTo(0,0)}
function bindFollow(){const b=document.getElementById('follow');if(!b)return;b.onclick=()=>{followed=!followed;try{localStorage.setItem('livewire-follow',followed?'1':'0')}catch{}b.textContent=followed?'♥ Following':'♡ Follow';document.getElementById('follows').textContent=followed?'4':'3'}}
function cards(){return '<div class="grid">'+clips.map((v,i)=>'<button class="video" data-clip="'+i+'"><div class="thumb"><strong>▶</strong>'+art('thumb-'+(i+1)+'.png','')+'<span class="duration">'+v[2]+'</span></div><h3>'+escapeText(v[0])+'</h3><small>'+v[3]+' · '+v[1]+'</small></button>').join('')+'</div>'}
const lines=[['00:05','PixelToast','hiii'],['00:12',name,'HELLO!! can you hear me??'],['00:20','WoollyWanderer','yes lol'],['00:28',name,'oh thank goodness'],['00:45','PixelToast','what level are you now?'],['00:52',name,'20!!! finally!!!'],['01:02',name,'my friend '+nick+' helped me a lot :D'],['01:18','WoollyWanderer','grats!!!'],['01:32',name,'WAIT I THINK I PULLED SOMETHING'],['01:36','PixelToast','RUN'],['01:44',name,'...'],['01:51','WoollyWanderer','F'],['02:03',name,'we do not talk about that']];
function appendLine(who,msg,time){const log=document.getElementById('chatlog');if(!log)return;const p=document.createElement('p'),t=document.createElement('small'),b=document.createElement('b');t.textContent=time+' ';b.textContent=who+': ';p.append(t,b,document.createTextNode(msg));log.append(p);log.scrollTop=log.scrollHeight}
function stopReplay(){if(replayTimer!==null){clearInterval(replayTimer);replayTimer=null}}
function stream(title,index=-1){stopReplay();root.innerHTML=channelHeader()+channelTabs('stream')+'<div class="stream-layout"><section><div class="player" id="player"><div class="stream-overlay"><span class="live" style="background:#514366">STREAM REPLAY</span></div>'+art(index<0?'stream-still.png':'thumb-'+(index+1)+'.png','Stream still')+'<div class="placeholder" id="intro-placeholder"><strong>Rookie’s stream</strong><span>Recorded broadcast · Mythbound</span><button id="intro" class="accent">▶ Play introduction</button></div></div><div class="stream-meta"><div><h2>'+escapeText(title)+'</h2><p class="muted">Mythbound · 3 viewers at time of recording</p><span class="tag">Beginner friendly</span><span class="tag">Chill gaming</span><span class="tag">English</span></div><button id="replay">Restart chat replay</button></div></section><aside class="chat"><h3>STREAM CHAT · REPLAY</h3><div class="chatlog" id="chatlog"></div><form id="chat-form"><input id="chat-input" maxlength="250" placeholder="Send a local chat message" aria-label="Chat message"><button class="accent">Chat</button></form></aside></div><h2>Recent broadcasts</h2>'+cards()+footer();bindFollow();bindTabs();bindCards();startReplay();document.getElementById('replay').onclick=startReplay;document.getElementById('chat-form').onsubmit=e=>{e.preventDefault();const input=document.getElementById('chat-input');if(input.value.trim()){appendLine(nick,input.value.trim(),'Now');input.value=''}};document.getElementById('intro').onclick=playIntro}
function startReplay(){stopReplay();const log=document.getElementById('chatlog');if(!log)return;log.replaceChildren();let i=0;function next(){if(i>=lines.length){stopReplay();return}const t=lines[i++];appendLine(t[1],t[2],t[0])}next();next();replayTimer=setInterval(next,2300)}
function playIntro(){const holder=document.getElementById('intro-placeholder');const vid=document.createElement('video');vid.className='intro';vid.controls=true;vid.playsInline=true;vid.preload='metadata';vid.src='assets/introduction.mp4';vid.addEventListener('error',()=>{vid.remove();holder.hidden=false;holder.innerHTML='<strong>Introduction coming soon!</strong><span>The animated clip is not uploaded yet.</span>'},{once:true});vid.addEventListener('loadeddata',()=>{holder.hidden=true;vid.play().catch(()=>{})},{once:true});document.getElementById('player').append(vid)}
function bindCards(){root.querySelectorAll('[data-clip]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.clip);stream(clips[i][0],i);window.scrollTo(0,0)})}
function bindTabs(){document.getElementById('following').onclick=followingPage;document.getElementById('stream').onclick=()=>stream('Learning Mythbound with friends ♡');document.getElementById('videos').onclick=()=>{stopReplay();root.innerHTML=channelHeader()+channelTabs('videos')+cards()+footer();bindFollow();bindTabs();bindCards()};document.getElementById('about').onclick=()=>{stopReplay();root.innerHTML=channelHeader()+channelTabs('about')+'<div class="aboutcard"><h2>About me!</h2><p>I started streaming because I love Mythbound, even though I’m terrible at it sometimes. My friend '+escapeText(nick)+' helps me with all the difficult stuff. Thanks for being here!!</p><p><a class="tag" href="../mythbound/">Play Mythbound with me ↗</a></p><p class="muted">No set schedule yet. I stream whenever I can!</p></div>'+footer();bindFollow();bindTabs()}}
document.getElementById('home').onclick=()=>stream('Learning Mythbound with friends ♡');stream('Learning Mythbound with friends ♡');
</script></body></html>
